<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F100E">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>EIA Impact Assessor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column app shell — sticky bar, section switcher (history · dashboard · compare), record detail with heatmap + matrix, bottom sheet editor */
:root{
  --bg:#F2F3EB; --surface:#FFFFFF; --surface-2:#E8EADD; --line:#D3D6C4;
  --fg:#1B1C15; --muted:#5F6256;
  --accent:#CFDD52; --accent-ink:#1A1C0B; --accent-text:#556112; --olive:#E3E7C4;
  --low:#2F8A4E; --med:#2F62C4; --high:#C93A30;
  --shadow:0 10px 30px -12px rgba(40,44,20,.25);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F100E; --surface:#1A1B17; --surface-2:#23251E; --line:#33352B;
  --fg:#ECEDE3; --muted:#9C9F8E;
  --accent:#D7E36C; --accent-ink:#191B0B; --accent-text:#D7E36C; --olive:#2B2C14;
  --low:#6FCB8A; --med:#86A9F2; --high:#F27D70;
  --shadow:0 14px 40px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F100E; --surface:#1A1B17; --surface-2:#23251E; --line:#33352B;
  --fg:#ECEDE3; --muted:#9C9F8E;
  --accent:#D7E36C; --accent-ink:#191B0B; --accent-text:#D7E36C; --olive:#2B2C14;
  --low:#6FCB8A; --med:#86A9F2; --high:#F27D70;
  --shadow:0 14px 40px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.logo-txt{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .2s}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}
.me{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--accent);object-fit:cover}

/* hero */
.hero{padding-block:28px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 .18em;border-radius:.2em}
.lede{color:var(--muted);max-width:60ch;margin:0}
.formula{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-mono);font-size:13px;margin-top:4px}
.formula span{padding:3px 7px;border-radius:7px;background:var(--surface-2)}
.formula b{padding:3px 8px;border-radius:7px;background:var(--accent);color:var(--accent-ink)}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:8px 16px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--high);border-color:color-mix(in oklab,var(--high) 40%,var(--line))}
.btn.danger.armed{background:var(--high);color:var(--surface);border-color:transparent}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* feed */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms);min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in oklab,var(--accent-text) 45%,var(--line))}
.card h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who img{width:22px;height:22px;border-radius:50%;flex:none}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.mine{background:var(--accent);color:var(--accent-ink)}
.tag.ex{background:var(--olive);color:var(--accent-text)}
.strip{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.strip i{display:block;height:100%;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.peak{display:flex;align-items:baseline;gap:6px}
.peak .num{font-size:22px;font-weight:600}
.peak small{color:var(--muted);font-size:12px}
@keyframes rise{from{transform:translateY(10px);opacity:.35}to{transform:none;opacity:1}}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.02em;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.low{color:var(--low);background:color-mix(in oklab,var(--low) 14%,transparent)}
.chip.med{color:var(--med);background:color-mix(in oklab,var(--med) 14%,transparent)}
.chip.high{color:var(--high);background:color-mix(in oklab,var(--high) 15%,transparent)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--fg);margin:0;font-size:20px}
.notice{border-radius:12px;padding:12px 14px;background:var(--olive);color:var(--fg);font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent-text)}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;padding:18px 0 6px}
.back svg{width:16px;height:16px}
.d-head{display:grid;gap:10px;padding-block:6px 18px}
.d-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.05;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px;align-items:center}
.desc{max-width:65ch;margin:0;color:var(--fg);opacity:.85;overflow-wrap:anywhere}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.kpi .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.2}
.kpi.high .val{color:var(--high)}
.kpi.med .val{color:var(--med)}
.kpi.low .val{color:var(--low)}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h3{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700}
.panel-h .hint{font-size:12px;color:var(--muted)}

.chart{width:100%;display:block}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .lab{fill:var(--fg);font-family:var(--f-body);font-size:12px;font-weight:600}
.chart .val{fill:var(--fg);font-weight:600}
.chart .bar-r{transform-box:fill-box;transform-origin:left center;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.08)}to{transform:none}}

.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:separate;border-spacing:3px;width:100%;min-width:560px}
th{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);padding:6px;text-align:center}
th:first-child{text-align:left}
td{text-align:center;padding:9px 6px;border-radius:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
td.name{text-align:left;font-family:var(--f-body);font-weight:700;background:var(--surface-2);min-width:120px;max-width:220px;overflow-wrap:anywhere}
td.name small{display:block;font-weight:500;color:var(--muted);font-size:11px}
td.h{font-weight:700}
tr.row{cursor:pointer}
tr.row:hover td{filter:brightness(1.06)}
.heat{background:color-mix(in oklab,var(--high) calc(var(--p) * 42%),var(--surface-2))}
td.h.low{background:color-mix(in oklab,var(--low) 22%,transparent);color:var(--low)}
td.h.med{background:color-mix(in oklab,var(--med) 22%,transparent);color:var(--med)}
td.h.high{background:color-mix(in oklab,var(--high) 24%,transparent);color:var(--high)}

.imp-list{display:grid;gap:10px}
.imp{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);text-align:left;border:1px solid transparent;width:100%;transition:border-color .2s,transform .2s}
.imp:hover{border-color:var(--line);transform:translateX(2px)}
.imp b{font-size:15px;overflow-wrap:anywhere}
.imp p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.imp p strong{color:var(--fg);font-weight:600}

.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 30%,transparent)}
.timeline li::after{content:"";position:absolute;left:4.5px;top:20px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .t{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.timeline .w{font-size:14px;overflow-wrap:anywhere}

details.guide summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted);transition:transform .25s}
details.guide[open] summary::after{transform:rotate(45deg)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.g-crit{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.g-crit h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.g-crit h4 .k{font-family:var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;font-size:12px}
.g-crit ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.g-crit li{display:flex;justify-content:space-between;gap:8px}
.g-crit li .num{color:var(--muted)}
.bands{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,11,8,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:min(760px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .38s cubic-bezier(.2,.9,.25,1) both;box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);max-height:min(88%,900px)}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-family:var(--f-display);font-size:20px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:16px 18px;display:grid;gap:18px;overscroll-behavior:contain}
.sheet-f{border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.sheet-f .spacer{min-width:8px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent-text);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 35%,transparent)}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;transition:all .2s}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.crit{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.crit-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.crit-h .k{font-family:var(--f-mono);font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:2px 8px;font-size:13px}
.crit-h b{flex:1;font-size:14px}
.crit-h .num{font-size:18px;font-weight:600;min-width:1.5ch;text-align:right;transition:color .2s}
.opts{display:grid}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;text-align:left;border-top:1px solid color-mix(in oklab,var(--line) 60%,transparent);font-size:14px;transition:background .15s}
.opt:first-child{border-top:0}
.opt:hover{background:var(--surface-2)}
.opt .rdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .2s}
.opt[aria-checked="true"]{background:color-mix(in oklab,var(--accent) 18%,transparent)}
.opt[aria-checked="true"] .rdot{border-color:var(--accent-text);background:var(--accent-text);box-shadow:inset 0 0 0 3px var(--surface)}
.opt span.t{flex:1}
.opt .sc{font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2)}
.live{position:sticky;bottom:0;z-index:2;margin:0 -18px -16px;padding:12px 18px;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;gap:8px}
.live-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live .bigH{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1}
.live .eq{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.gauge{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--low) 0 var(--g1),var(--med) var(--g1) var(--g2),var(--high) var(--g2) 100%);opacity:.95}
.gauge .needle{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.9,.25,1.2);left:0}
.gauge-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toast .3s cubic-bezier(.2,.9,.25,1.2) both;max-width:calc(100% - 32px)}
@keyframes toast{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;height:54px;padding:0 20px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .2s}
.fab:hover{transform:translateY(-2px) scale(1.02)}
.fab svg{width:20px;height:20px}

function allAssessments(){
  const out = [];
  for (const [owner, doc] of Object.entries(S.docs)) for (const a of (doc.items||[])) out.push({...a, owner});
  if (S.offline) for (const a of (local.items||[])) out.push({...a, owner:"local"});
  out.sort((a,b)=>b.updatedAt-a.updatedAt);
  return out;
}
const keyOf = a => (a.owner||"") + "|" + a.id;
function myItems(){ return S.offline ? (local.items||[]) : ((S.docs[S.meId]||{}).items || []); }
function isMine(a){ return a.owner && (a.owner==="local" || a.owner===S.meId); }
function canEditA(a){ return a.owner==="local" || (isMine(a) && S.canWrite); }
function findA(owner, id){ return allAssessments().find(a=>a.owner===owner && a.id===id); }
function findKey(k){ const [o,id] = k.split("|"); return findA(o, id); }

let writeChain = Promise.resolve();
function saveMine(items){
  if (S.offline){ local.items = items; if (S.standalone){ try { localStorage.setItem("eia-data", JSON.stringify({items})); } catch(e){ toast("This browser blocked saving. Use Backup to keep a copy."); } } render(); return Promise.resolve(true); }
  if (S.sb) return sbSave(items);
  const ref = S.db.doc("assessments/"+S.meId);
  const body = {owner:S.meId, updatedAt:Date.now(), items};
  S.docs[S.meId] = body; render();
  writeChain = writeChain.then(()=>ref.set(body)).then(()=>true, e=>{
    if (e && e.code==="quota_exceeded") toast("Storage is full. Delete an old assessment and try again.");
    else if (e && e.code==="invalid_argument") { S.canWrite=false; toast("You can view assessments but not save them. Ask the owner for edit access."); }
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  });
  return writeChain;
}
function summarize(a){
  const hs=a.impacts.map(i=>H(i.sel)); const rs=a.impacts.map(HR);
  const b={low:0,med:0,high:0}; hs.forEach(h=>b[band(h)]++);
  const rb={low:0,med:0,high:0}; rs.forEach(h=>rb[band(h)]++);
  const tot=hs.reduce((x,y)=>x+y,0), rtot=rs.reduce((x,y)=>x+y,0);
  return {n:hs.length, peak:hs.length?Math.max(...hs):0, rpeak:rs.length?Math.max(...rs):0, bands:b, rbands:rb,
    scored:a.impacts.filter(i=>i.rsel).length, cut:pct(tot,rtot), evidence:a.impacts.reduce((n,i)=>n+(i.evidence||[]).length,0)};
}
function withHistory(a, note){ const s=summarize(a); const h=(a.history||[]).slice(-39); h.push({at:Date.now(), note, n:s.n, peak:s.peak, high:s.bands.high, rpeak:s.rpeak}); return {...a, history:h, updatedAt:Date.now()}; }
function strip(a){ const x={...a}; delete x.owner; return x; }
function upsert(a, note){ const items = myItems().filter(x=>x.id!==a.id); items.push(withHistory(strip(a), note)); return saveMine(items); }
function removeA(id){ return saveMine(myItems().filter(x=>x.id!==id)); }

/* ---------- Rendering ---------- */
let renderTok = 0;
async function render(){
  const tok = ++renderTok;
  const ids = [...new Set(Object.keys(S.docs).concat(S.meId ? [S.meId] : []))];
  if (S.user && ids.length){ try { S.profiles = await S.user.profiles(ids); } catch(e){} }
  if (tok !== renderTok) return;
  const app = $("#app"), v = S.view.name;
  if (S.needAuth){ app.innerHTML = heroHTML() + authHTML(); bindAuth(); return; }
  if (v === "detail"){ const a = findA(S.view.owner, S.view.id); if (a){ app.innerHTML = detailHTML(a); afterCounts(); return; } S.view={name:"history"}; }
  if (v === "dashboard"){ app.innerHTML = heroHTML() + navHTML("dashboard") + dashboardHTML(); afterCounts(); return; }
  if (v === "compare"){ app.innerHTML = heroHTML() + navHTML("compare") + compareHTML(); afterCounts(); return; }
  app.innerHTML = heroHTML() + navHTML("history") + historyHTML(); afterHistory();
}
function person(owner){
  if (owner==="local") return {name: S.standalone ? "You" : "You (not saved)", avatar:""};
  if (S.sb){ const p = S.sbProfiles[owner]; return {name: owner===S.meId ? "You" : ((p && p.name) || "A colleague"), avatar:""}; }
  const p = S.profiles[owner]; const me = owner===S.meId;
  return {name: me ? "You" : ((p && p.name) || "A colleague"), avatar: p ? p.avatarUrl : ""};
}
function stripHTML(bands, n){ if(!n) return '<div class="strip"></div>'; return `<div class="strip" aria-label="${bands.high} high, ${bands.med} medium, ${bands.low} low">${["high","med","low"].map(k=>bands[k]?`<i style="flex-grow:${bands[k]};background:var(--${k})"></i>`:"").join("")}</div>`; }
const statusHTML = s => `<span class="status ${s||"draft"}">${STATUS[s||"draft"]}</span>`;

function heroHTML(){
  const n = allAssessments().length;
  return `<section class="hero">
    <div class="eyebrow">Impact analysis · evaluation matrix</div>
    <h1>Score every impact. <em>See the risk.</em></h1>
    <p class="lede">Define the impacts of your project, rate each one on seven criteria, and the significance score H classifies it. ${n ? `${n} assessment${n>1?"s":""} recorded so far.` : "Everyone's results are visible here; only the author can change theirs."}</p>
    <div class="formula" aria-label="H equals A times B times C times D times E times F times G">${CRITERIA.map(c=>`<span>${c.k}</span>`).join("×")} = <b>H</b></div>
  </section>`;
}
function navHTML(cur){
  const notice = S.unconfigured
    ? `<div class="notice">${ICON.info}<div><b>Not connected to Supabase yet.</b> Open this file in a text editor and paste your project URL and publishable key near the top. Until then, assessments save in this browser only.</div></div>`
    : S.standalone
    ? `<div class="notice">${ICON.info}<div>Assessments you make here are saved in this browser on this device. Tap <b>Backup</b> to save them as a file you can send to colleagues, and <b>Import</b> to load a file someone sent you.</div></div>`
    : S.offline
    ? `<div class="notice">${ICON.info}<div>The shared database isn't reachable in this view, so assessments you make now stay on this screen only. Open the app from its claude.ai link while signed in to save and share them.</div></div>`
    : (!S.canWrite && S.ready ? `<div class="notice">${ICON.lock.replace('width="12" height="12"','')}<div>You're viewing in read-only mode. You can explore every assessment; to create your own, ask the app owner for edit access.</div></div>` : "");
  return `${notice}<div class="nav">
    <div class="seg" role="group" aria-label="Sections">
      <button data-tab="history" aria-pressed="${cur==="history"}">${ICON.hist}History</button>
      <button data-tab="dashboard" aria-pressed="${cur==="dashboard"}">${ICON.dash}Dashboard</button>
      <button data-tab="compare" aria-pressed="${cur==="compare"}">${ICON.cmp}Compare</button>
      ${S.canWrite?`<button data-act="new" aria-pressed="false">${ICON.plus}Add</button>`:""}
    </div>
    ${S.standalone?`<button class="btn" data-act="backup">${ICON.dl} Backup</button><label class="btn" for="imp-file" style="cursor:pointer">${ICON.clip} Import</label><input type="file" id="imp-file" accept=".json,application/json" hidden>`:""}
    ${cur==="history"?`<label class="search">${ICON.search}<input id="q" type="search" placeholder="Search projects or impacts" value="${esc(S.q)}" aria-label="Search"></label>`:""}
  </div>`;
}
function emptyStore(){
  return `<div class="empty"><h3>No assessments yet</h3><div>Tap Add to start one for your project, list the impacts you expect, and score each against criteria A–G.</div>${S.canWrite?`<button class="btn primary" data-act="new">${ICON.plus} Add assessment</button>`:""}</div>`;
}
function historyHTML(){
  const q = norm(S.q); const all = allAssessments();
  const list = all.filter(a => !q || norm([a.title,a.project,a.location,STATUS[a.status||"draft"],...a.impacts.map(i=>i.name)].join(" ")).includes(q));
  const body = !all.length ? emptyStore()
    : !list.length ? `<div class="empty"><h3>Nothing matches “${esc(S.q)}”</h3><div>Try a project name, location, status or impact.</div></div>`
    : `<div class="grid">${list.map(cardHTML).join("")}</div>`;
  return body + guideHTML();
}
function cardHTML(a, i){
  const s = summarize(a); const p = person(a.owner);
  return `<button class="card" style="--i:${i}" data-open="${esc(keyOf(a))}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div style="min-width:0"><h3>${esc(a.title)}</h3><div class="sub">${esc([a.project,a.location].filter(Boolean).join(" · "))}</div></div>
      <div style="display:grid;gap:4px;justify-items:end">${isMine(a)?'<span class="tag mine">Yours</span>':""}${statusHTML(a.status)}</div>
    </div>
    ${stripHTML(s.bands, s.n)}
    <div class="card-foot">
      <div class="peak"><span class="num">${s.peak.toLocaleString()}</span><small>peak H · ${s.n} impact${s.n===1?"":"s"}${s.scored?` · −${s.cut}% after measures`:""}</small></div>
      ${s.n ? `<span class="chip ${band(s.peak)}">${BAND_NAME[band(s.peak)]}</span>` : `<span class="tag">No impacts</span>`}
    </div>
    <div class="who">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:""}<span>${esc(p.name)} · ${ago(a.updatedAt)}</span></div>
  </button>`;
}
function guideHTML(){
  return `<details class="panel guide" style="margin-top:22px"><summary>Scoring guide: criteria A–G and risk bands</summary>
    <div class="g-grid">${CRITERIA.map(c=>`<div class="g-crit"><h4><span class="k">${c.k}</span>${esc(c.name)}</h4><ul>${c.opts.map(o=>`<li><span>${esc(o[0])}</span><span class="num">${o[1]}</span></li>`).join("")}</ul></div>`).join("")}</div>
    <div class="bands">${["low","med","high"].map(b=>`<span class="chip ${b}">${BAND_NAME[b]} · ${BAND_RULE[b]}</span>`).join("")}</div>
    <p class="lede" style="margin-top:10px;font-size:13px">H = A × B × C × D × E × F × G, from 1 up to ${MAXH.toLocaleString()}. Impacts in the High band call for control or mitigation measures.</p>
  </details>`;
}
function afterHistory(){
  const q = $("#q"); if (q) q.addEventListener("input", e=>{ S.q=e.target.value; const pos=e.target.selectionStart; render().then(()=>{ const n=$("#q"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } }); });
}
function afterCounts(){ document.querySelectorAll("[data-count]").forEach(el=>countUp(el, Number(el.dataset.count))); }

/* ---------- Charts ---------- */
function chartHTML(imps){
  const rows = imps.map(i=>({i, h:H(i.sel)})).sort((a,b)=>b.h-a.h);
  const W = 640, labW = 120, rh = 30, top = 22, bot = 24, plotW = W - labW - 56;
  const Hh = top + rows.length*rh + bot;
  const x = h => labW + logPos(h)/100*plotW;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Significance score by impact, log scale">`;
  [1,10,100,1000,10000].forEach(t=>{ s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top-6}" y2="${Hh-bot}" stroke="var(--line)" stroke-width="1"/><text x="${x(t)}" y="${Hh-8}" text-anchor="middle">${t.toLocaleString()}</text>`; });
  [25,200].forEach(t=>{ s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top-10}" y2="${Hh-bot}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="${x(t)}" y="${top-12}" text-anchor="middle">${t}</text>`; });
  rows.forEach((r,k)=>{
    const y = top + k*rh, b = band(r.h), w = Math.max(4, x(r.h)-labW);
    const nm = r.i.name.length>16 ? r.i.name.slice(0,15)+"…" : r.i.name;
    s += `<text class="lab" x="${labW-10}" y="${y+rh/2+4}" text-anchor="end">${esc(nm)}</text>`;
    s += `<rect class="bar-r" style="animation-delay:${k*60}ms" x="${labW}" y="${y+6}" width="${w}" height="${rh-12}" rx="5" fill="var(--${b})"/>`;
    s += `<text class="val" x="${labW+w+6}" y="${y+rh/2+4}">${r.h.toLocaleString()}</text>`;
  });
  return s + `</svg>`;
}
function beforeAfterHTML(imps){
  const rows = imps.filter(i=>i.rsel).map(i=>({i,h:H(i.sel),r:H(i.rsel)})).sort((a,b)=>b.h-a.h);
  if (!rows.length) return `<p class="lede" style="font-size:14px">No residual scores yet. Open an impact and switch to <b>After mitigation</b> to score it with your measures in place.</p>`;
  return `<div class="ba">${rows.map((x,k)=>{ const d=pct(x.h,x.r); return `<div class="ba-row">
    <b>${esc(x.i.name)}</b>
    <div class="ba-bars"><div class="ba-bar"><i style="width:${Math.max(3,logPos(x.h))}%;background:var(--${band(x.h)});animation-delay:${k*70}ms"></i></div><div class="ba-bar after"><i style="width:${Math.max(3,logPos(x.r))}%;background:var(--${band(x.r)});animation-delay:${k*70+250}ms"></i></div></div>
    <div class="ba-num">${x.h.toLocaleString()} <span class="arrow">→</span> ${x.r.toLocaleString()}<span class="drop ${d<0?"up":""}">${d>0?"−"+d+"%":d<0?"+"+(-d)+"%":"no change"}</span></div>
  </div>`;}).join("")}</div><div class="legend"><span class="tag">Top bar: current</span><span class="tag">Bottom bar: after measures</span></div>`;
}
function heatmapHTML(imps){
  const ranked = imps.slice().sort((a,b)=>H(b.sel)-H(a.sel));
  const rank = new Map(ranked.map((i,k)=>[i.id,k+1]));
  let g = "";
  for (let d=5; d>=1; d--){
    g += `<div class="hm-ax">${d}</div>`;
    for (let a=1; a<=5; a++){
      const p=a*d, cls = p<=4?"l":p<=12?"m":"h";
      const here = ranked.filter(i=>scoreOf("A",i.sel.A)===a && scoreOf("D",i.sel.D)===d);
      g += `<div class="hm-cell ${cls}" title="A ${a} × D ${d}">${here.map(i=>`<button class="dot ${band(H(i.sel))}" data-imp="${esc(i.id)}" title="${esc(i.name)} · H ${H(i.sel).toLocaleString()}" aria-label="${esc(i.name)}">${rank.get(i.id)}</button>`).join("")}</div>`;
    }
  }
  g += `<div></div>${[1,2,3,4,5].map(a=>`<div class="hm-ax">${a}</div>`).join("")}`;
  return `<div class="hm"><div class="hm-y">D · Scale / Severity</div><div><div class="hm-grid">${g}</div><div class="hm-x">A · Quantity / Magnitude</div></div></div>
    <div class="hm-key">${ranked.map(i=>`<span><span class="dot ${band(H(i.sel))}">${rank.get(i.id)}</span>${esc(i.name)}</span>`).join("")}</div>`;
}
function sparkHTML(hist){
  if (hist.length < 2) return "";
  const W=600, Hh=70, p=8, n=hist.length;
  const ys = hist.map(h=>Math.max(1,h.peak));
  const lo = Math.log10(Math.min(...ys)), hi = Math.max(lo+1, Math.log10(Math.max(...ys)));
  const X = k => p + k*(W-2*p)/(n-1), Y = v => Hh-14 - (Math.log10(v)-lo)/(hi-lo)*(Hh-28);
  const d = ys.map((v,k)=>(k?"L":"M")+X(k).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  return `<svg class="spark chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Peak H over time">
    <path d="${d} L${X(n-1)},${Hh-14} L${X(0)},${Hh-14} Z" fill="color-mix(in oklab,var(--accent) 22%,transparent)"/>
    <path class="trend" d="${d}"/>
    <circle cx="${X(n-1)}" cy="${Y(ys[n-1])}" r="4" fill="var(--accent-text)"/>
    <text x="${p}" y="${Hh-2}">${fmtShort(hist[0].at)}</text><text x="${W-p}" y="${Hh-2}" text-anchor="end">${fmtShort(hist[n-1].at)} · peak ${ys[n-1].toLocaleString()}</text>
  </svg>`;
}
function evThumbs(i){
  const ev = i.evidence||[]; if(!ev.length) return "";
  const imgs = ev.filter(e=>/^image\//.test(e.type)).slice(0,4);
  const rest = ev.length - imgs.length;
  return `<div class="ev-thumbs">${imgs.map(e=>`<img src="${esc(blobUrl(e.id))}" alt="${esc(e.name)}" loading="lazy">`).join("")}${rest>0?`<span class="tag">${ICON.clip.replace('<svg','<svg width="12" height="12"')} ${rest} file${rest>1?"s":""}</span>`:""}</div>`;
}

/* ---------- Detail ---------- */
function detailHTML(full){
  const mine = canEditA(full);
  const ph = S.phase;
  const a = ph ? {...full, impacts: full.impacts.filter(i=>phasesOf(i).includes(ph))} : full;
  const s = summarize(a); const p = person(a.owner);
  const imps = a.impacts.slice().sort((x,y)=>H(y.sel)-H(x.sel));
  const phaseBar = full.impacts.length ? `<div class="phase-bar"><span class="lbl">Project phase</span><div class="seg" role="group" aria-label="Filter by phase">${["",...PHASES].map(x=>{ const n = x ? full.impacts.filter(i=>phasesOf(i).includes(x)).length : full.impacts.length; return `<button data-phase="${x}" aria-pressed="${ph===x}">${x||"All phases"} <span class="num" style="opacity:.6">${n}</span></button>`; }).join("")}</div></div>` : "";
  const maxOf = k => Math.max(...CRITERIA.find(c=>c.k===k).opts.map(o=>o[1]));
  const table = imps.length ? `<div class="tbl-wrap"><table><thead><tr><th>Impact</th>${CRITERIA.map(c=>`<th title="${esc(c.name)}">${c.k}</th>`).join("")}<th>H</th><th title="After mitigation">H′</th></tr></thead><tbody>
    ${imps.map(i=>{ const h=H(i.sel), r=i.rsel?H(i.rsel):null; return `<tr class="row" data-imp="${esc(i.id)}" tabindex="0"><td class="name">${esc(i.name)}<small>${esc([i.category, phasesOf(i).join(", ")].filter(Boolean).join(" · "))}</small></td>${CRITERIA.map(c=>{ const v=scoreOf(c.k,i.sel[c.k]); const pr=(v-1)/Math.max(1,maxOf(c.k)-1); return `<td class="heat" style="--p:${pr.toFixed(2)}">${v}</td>`;}).join("")}<td class="h ${band(h)}">${h.toLocaleString()}</td><td class="${r==null?"":"h "+band(r)}">${r==null?"—":r.toLocaleString()}</td></tr>`;}).join("")}
  </tbody></table></div>` : `${ph && full.impacts.length ? `<div class="empty"><h3>No impacts in ${esc(ph)}</h3><div>None of this assessment's impacts are marked for the ${esc(ph.toLowerCase())} phase.</div></div>` : ""}${ph && full.impacts.length ? "" : `<div class="empty"><h3>No impacts yet</h3><div>${mine?"Add the first impact this project could cause, such as an emission, a discharge or a social effect.":"The author hasn't added impacts yet."}</div>${mine?`<button class="btn primary" data-act="add-imp">${ICON.plus} Add impact</button>`:""}</div>`}`;
  const st = a.status||"draft";
  const actions = mine
    ? `<button class="btn primary" data-act="add-imp">${ICON.plus} Add impact</button><button class="btn" data-act="edit-a">${ICON.edit} Edit details</button><button class="btn danger" data-act="del-a">Delete</button>`
    : `<span class="tag">${ICON.lock} Read only · only the author can edit</span>${S.canWrite?`<button class="btn" data-act="copy">${ICON.copy} Copy to mine</button>`:""}`;
  const hist = (full.history||[]);
  return `
  <button class="back" data-act="home">${ICON.back} History</button>
  <section class="d-head" id="d-head">
    <div class="meta"><span class="who">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:""}<span>${esc(p.name)}</span></span>${statusHTML(st)}${a.location?`<span>${esc(a.location)}</span>`:""}<span>Updated ${ago(a.updatedAt)}</span></div>
    <h2>${esc(a.title)}</h2>
    ${a.project?`<div class="eyebrow">${esc(a.project)}</div>`:""}
    ${a.description?`<p class="desc">${esc(a.description)}</p>`:""}
    ${mine?`<div class="status-pick" role="group" aria-label="Review status">${Object.entries(STATUS).map(([k,v])=>`<button data-status="${k}" aria-pressed="${st===k}">${v}</button>`).join("")}</div>`:""}
    <div class="d-actions">${actions}${s.n?`<button class="btn ghost" data-act="pdf">${ICON.pdf} PDF report</button><button class="btn ghost" data-act="csv">${ICON.dl} CSV</button>`:""}${S.comments?`<button class="btn ghost" data-act="comment">${ICON.msg} Comment</button>`:""}<button class="btn ghost" data-act="compare-this">${ICON.cmp} Compare</button></div>
  </section>
  ${phaseBar}
  <div class="kpis">
    <div class="kpi"><div class="lbl">Impacts</div><div class="val" data-count="${s.n}">0</div></div>
    <div class="kpi ${s.n?band(s.peak):""}"><div class="lbl">Peak H</div><div class="val" data-count="${s.peak}">0</div></div>
    <div class="kpi ${s.scored?band(s.rpeak):""}"><div class="lbl">Peak after measures</div><div class="val">${s.scored?`<span data-count="${s.rpeak}">0</span>`:"—"}</div></div>
    <div class="kpi high"><div class="lbl">High · Med · Low</div><div class="val"><span data-count="${s.bands.high}">0</span><span style="color:var(--muted)"> · </span><span style="color:var(--med)" data-count="${s.bands.med}">0</span><span style="color:var(--muted)"> · </span><span style="color:var(--low)" data-count="${s.bands.low}">0</span></div></div>
  </div>
  ${s.n?`<div class="panel"><div class="panel-h"><h3>Significance by impact</h3><span class="hint">Log scale · dashed lines at 25 and 200</span></div>${chartHTML(a.impacts)}</div>
  <div class="dash-grid" style="margin-bottom:14px">
    <div class="panel"><div class="panel-h"><h3>Risk heatmap</h3><span class="hint">Magnitude × severity · tap a dot</span></div>${heatmapHTML(a.impacts)}</div>
    <div class="panel"><div class="panel-h"><h3>Before and after mitigation</h3>${s.scored?`<span class="hint">Total H down ${s.cut}%</span>`:""}</div>${beforeAfterHTML(a.impacts)}</div>
  </div>`:""}
  <div class="panel"><div class="panel-h"><h3>Evaluation matrix</h3>${s.n?`<span class="hint">${mine?"Tap a row to edit":"Tap a row for details"}</span>`:""}</div>${table}</div>

/* ---------- Dashboard ---------- */
function dashboardHTML(){
  const all = allAssessments();
  if (!all.length) return emptyStore();
  const imps = all.flatMap(a=>a.impacts.map(i=>({...i, a})));
  const b={low:0,med:0,high:0}; imps.forEach(i=>b[band(H(i.sel))]++);
  const rb={low:0,med:0,high:0}; imps.forEach(i=>rb[band(HR(i))]++);
  const owners = new Set(all.map(a=>a.owner)).size;
  const st = {draft:0,review:0,approved:0}; all.forEach(a=>st[a.status||"draft"]++);
  // recurring high-risk impacts
  const groups = {};
  imps.forEach(i=>{ const k=norm(i.name); if(!k) return; const g = groups[k] || (groups[k]={name:i.name,n:0,high:0,sum:0,max:0}); const h=H(i.sel); g.n++; g.sum+=h; g.max=Math.max(g.max,h); if(band(h)==="high") g.high++; });
  const top = Object.values(groups).sort((x,y)=>y.high-x.high || y.max-x.max).slice(0,6);
  const topMax = Math.max(1,...top.map(g=>g.max));
  // categories
  const cats = {}; imps.forEach(i=>{ const c=i.category||"Other"; const g=cats[c]||(cats[c]={n:0,sum:0,max:0}); const h=H(i.sel); g.n++; g.sum+=h; g.max=Math.max(g.max,h); });
  const catRows = Object.entries(cats).map(([c,g])=>({c, avg:Math.round(g.sum/g.n), n:g.n})).sort((x,y)=>y.avg-x.avg);
  // trend: total high-risk impacts over time from history
  const ev = []; all.forEach(a=>(a.history||[]).forEach(h=>ev.push({at:h.at, k:keyOf(a), high:h.high||0})));
  ev.sort((x,y)=>x.at-y.at);
  const cur = {}; const pts = []; ev.forEach(e=>{ cur[e.k]=e.high; pts.push({at:e.at, v:Object.values(cur).reduce((s,v)=>s+v,0)}); });
  const total = imps.length || 1;
  const bar = (bb,label) => `<div style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${label}</b><span class="num" style="color:var(--muted)">${bb.high} high · ${bb.med} med · ${bb.low} low</span></div><div class="stack">${["high","med","low"].map(k=>bb[k]?`<i style="flex-grow:${bb[k]};background:var(--${k})"></i>`:"").join("")}</div></div>`;
  return `
  <div class="kpis five">
    <div class="kpi"><div class="lbl">Assessments</div><div class="val" data-count="${all.length}">0</div></div>
    <div class="kpi"><div class="lbl">Impacts</div><div class="val" data-count="${imps.length}">0</div></div>
    <div class="kpi high"><div class="lbl">High risk</div><div class="val" data-count="${b.high}">0</div></div>
    <div class="kpi low"><div class="lbl">Approved</div><div class="val" data-count="${st.approved}">0</div></div>
    <div class="kpi"><div class="lbl">Contributors</div><div class="val" data-count="${owners}">0</div></div>
  </div>
  <div class="dash-grid">
    <div class="panel"><div class="panel-h"><h3>Risk across all impacts</h3><span class="hint">${imps.length} scored</span></div>
      <div style="display:grid;gap:14px">${bar(b,"Current")}${bar(rb,"After mitigation")}</div>
      <div class="legend">${["high","med","low"].map(k=>`<span class="chip ${k}">${BAND_NAME[k]} ${Math.round(b[k]/total*100)}%</span>`).join("")}</div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Review status</h3></div>
      <div class="stack" style="height:22px">${Object.keys(STATUS).map((k,ix)=>st[k]?`<i style="flex-grow:${st[k]};background:${["var(--muted)","var(--med)","var(--low)"][ix]}"></i>`:"").join("")}</div>
      <div class="legend">${Object.entries(STATUS).map(([k,v])=>`<span class="status ${k}">${v} · ${st[k]}</span>`).join("")}</div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Risk by project phase</h3><span class="hint">Impacts can span phases</span></div>
      <div style="display:grid;gap:14px">${PHASES.map(ph=>{ const bb={low:0,med:0,high:0}; imps.filter(i=>phasesOf(i).includes(ph)).forEach(i=>bb[band(H(i.sel))]++); return bar(bb, ph); }).join("")}</div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Recurring high-risk impacts</h3><span class="hint">Peak H, grouped by name</span></div>
      <div class="hbars">${top.map((g,k)=>`<div class="hbar"><span title="${esc(g.name)}">${esc(g.name)}</span><span class="track"><i style="width:${Math.max(3,Math.log10(g.max)/Math.log10(Math.max(10,topMax))*100)}%;background:var(--${band(g.max)});animation-delay:${k*70}ms"></i></span><span class="num">${g.max.toLocaleString()} · ${g.n}×${g.high?` · ${g.high} high`:""}</span></div>`).join("")}</div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Average H by category</h3></div>
      <div class="hbars">${catRows.map((r,k)=>`<div class="hbar"><span>${esc(r.c)}</span><span class="track"><i style="width:${Math.max(3,logPos(r.avg))}%;background:var(--${band(r.avg)});animation-delay:${k*70}ms"></i></span><span class="num">${r.avg.toLocaleString()} · ${r.n}</span></div>`).join("")}</div>
    </div>
  </div>
  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>High-risk impacts over time</h3><span class="hint">Across every assessment</span></div>${trendHTML(pts)}</div>`;
}
function trendHTML(pts){
  if (pts.length < 2) return `<p class="lede" style="font-size:14px">The trend appears once assessments have been updated a few times.</p>`;
  const W=640, Hh=200, L=36, R=14, T=14, B=26;
  const t0=pts[0].at, t1=Math.max(t0+1, pts[pts.length-1].at), vmax=Math.max(1,...pts.map(p=>p.v));
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R), Y=v=>T+(1-v/vmax)*(Hh-T-B);
  let d=""; pts.forEach((p,k)=>{ d += k ? ` H${X(p.at).toFixed(1)} V${Y(p.v).toFixed(1)}` : `M${X(p.at).toFixed(1)},${Y(p.v).toFixed(1)}`; });
  const ticks = [...new Set([0, Math.round(vmax/2), vmax])];
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="High-risk impact count over time">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    <path d="${d} V${Y(0)} H${X(t0)} Z" fill="color-mix(in oklab,var(--high) 14%,transparent)"/>
    <path class="trend" d="${d}" style="stroke:var(--high)"/>
    <circle cx="${X(last.at)}" cy="${Y(last.v)}" r="5" fill="var(--high)"/>
    <text x="${L}" y="${Hh-6}">${fmtShort(t0)}</text><text x="${W-R}" y="${Hh-6}" text-anchor="end">${fmtShort(t1)}</text>
  </svg>`;
}

/* ---------- Compare ---------- */
function compareHTML(){
  const all = allAssessments();
  if (all.length < 2) return all.length ? `<div class="empty"><h3>Compare needs two assessments</h3><div>Add another assessment, for example a different site or project phase, to see them side by side.</div>${S.canWrite?`<button class="btn primary" data-act="new">${ICON.plus} Add assessment</button>`:""}</div>` : emptyStore();
  if (!findKey(S.cmp.a)) S.cmp.a = keyOf(all[0]);
  if (!findKey(S.cmp.b) || S.cmp.b===S.cmp.a) S.cmp.b = keyOf(all.find(a=>keyOf(a)!==S.cmp.a));
  const A = findKey(S.cmp.a), B = findKey(S.cmp.b);
  const opt = sel => all.map(a=>`<option value="${esc(keyOf(a))}" ${keyOf(a)===sel?"selected":""}>${esc(a.title)}${isMine(a)?" (yours)":""}</option>`).join("");
  const sa = summarize(A), sb = summarize(B);
  const col = (x, s) => `<div class="cmp-col"><h3>${esc(x.title)}</h3><div class="who"><span>${esc(person(x.owner).name)}</span> ${statusHTML(x.status)}</div>${stripHTML(s.bands, s.n)}
    <div class="cmp-stats"><div><div class="lbl">Impacts</div><div class="val" data-count="${s.n}">0</div></div><div><div class="lbl">Peak H</div><div class="val" style="color:var(--${s.n?band(s.peak):"fg"})" data-count="${s.peak}">0</div></div>
    <div><div class="lbl">High</div><div class="val" style="color:var(--high)" data-count="${s.bands.high}">0</div></div><div><div class="lbl">After measures</div><div class="val">${s.scored?s.rpeak.toLocaleString():"—"}</div></div></div></div>`;
  const names = new Map();
  A.impacts.forEach(i=>{ const k=norm(i.name); names.set(k,{name:i.name, a:H(i.sel), b:null}); });
  B.impacts.forEach(i=>{ const k=norm(i.name); const e=names.get(k)||{name:i.name,a:null,b:null}; e.b=H(i.sel); names.set(k,e); });
  const rows = [...names.values()].sort((x,y)=>Math.max(y.a||0,y.b||0)-Math.max(x.a||0,x.b||0));
  const cell = v => v==null ? `<td style="color:var(--muted)">—</td>` : `<td class="h ${band(v)}">${v.toLocaleString()}</td>`;
  const diff = r => { if (r.a==null||r.b==null) return `<td><span class="diff eq">only in ${r.a==null?"B":"A"}</span></td>`; const d=r.b-r.a; return `<td><span class="diff ${d>0?"up":d<0?"down":"eq"}">${d>0?"+":""}${d.toLocaleString()}</span></td>`; };
  return `
  <div class="cmp-pick">
    <div class="field"><label for="cmp-a">Assessment A</label><select id="cmp-a">${opt(S.cmp.a)}</select></div>
    <div class="vs">vs</div>
    <div class="field"><label for="cmp-b">Assessment B</label><select id="cmp-b">${opt(S.cmp.b)}</select></div>
  </div>
  <div class="cmp-cols">${col(A,sa)}${col(B,sb)}</div>
  <div class="panel"><div class="panel-h"><h3>Impact by impact</h3><span class="hint">Matched by impact name · B minus A</span></div>
    ${rows.length?`<div class="tbl-wrap"><table style="min-width:420px"><thead><tr><th>Impact</th><th>H in A</th><th>H in B</th><th>Difference</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="name">${esc(r.name)}</td>${cell(r.a)}${cell(r.b)}${diff(r)}</tr>`).join("")}</tbody></table></div>`:`<p class="lede">Neither assessment has impacts yet.</p>`}
  </div>`;
}

/* ---------- Sheets ---------- */
function openSheet(html, onMount){
  const layer = $("#layer");
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = "hidden";
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
  onMount && onMount($(".sheet"));
  setTimeout(()=>{ const f=$(".sheet input:not([type=hidden]):not([type=file])"); f && f.focus({preventScroll:true}); }, 60);
}
function closeSheet(){ $("#layer").innerHTML=""; document.body.style.overflow=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#scrim")) closeSheet(); });

  return `You are an environmental impact assessment specialist. Score one impact with the evaluation matrix below. For each criterion, pick the 0-based index of the option that fits best.

Project: ${a.title}${a.project?" — "+a.project:""}${a.location?", "+a.location:""}
Scope: ${a.description||"not given"}
Impact: ${cur.name}
Category: ${cur.category}
Project phase(s) when it occurs: ${cur.phases.join(", ")||"not given"}
Notes from the assessor: ${cur.notes||"none"}
Measures already planned: ${cur.mitigation||"none"}

Criteria:
${crit}

H is the product of the seven scores. Bands: low H<25, medium 25-200, high H>200.
Also propose practical control and mitigation measures (at most 60 words), and score the same impact again assuming those measures are in place.

Reply with only JSON in this shape:
{"current":{"A":0,"B":0,"C":0,"D":0,"E":0,"F":0,"G":0},"after":{"A":0,"B":0,"C":0,"D":0,"E":0,"F":0,"G":0},"mitigation":"...","rationale":"one or two sentences explaining the main scores"}`;
}
function validSel(o){ if(!o||typeof o!=="object") return null; const s={}; for(const c of CRITERIA){ const v=Number(o[c.k]); if(!Number.isInteger(v)||v<0||v>=c.opts.length) return null; s[c.k]=v; } return s; }

      $("#live-eq").textContent = (mode==="after"?"After: ":"") + CRITERIA.map(c=>scoreOf(c.k,shown[c.k])).join(" × ") + " = " + H(shown).toLocaleString();
      $("#needle").style.left = logPos(h) + "%";
      const nr = $("#needle-r"), la = $("#live-after");
      if (cur.rsel){ const r=H(cur.rsel), d=pct(h,r); nr.hidden=false; nr.style.left=logPos(r)+"%"; la.innerHTML = `<span class="arrow">→</span><b style="color:var(--${band(r)})">${r.toLocaleString()}</b><span style="color:${d>0?"var(--low)":"var(--muted)"}">${d>0?"−"+d+"%":""}</span>`; }
      else { nr.hidden=true; la.innerHTML=""; }
      $("#mode-hint").textContent = cur.rsel ? "Residual score recorded" : "Not scored after mitigation yet";
      const cr = $("#clear-r"); if (cr) cr.hidden = !cur.rsel;
    };
    const bindCrit = ()=>{ sh.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click", ()=>{
      const k = btn.dataset.k, idx = Number(btn.dataset.idx);
      if (mode==="after"){ if(!cur.rsel) cur.rsel = {...cur.sel}; cur.rsel[k]=idx; } else cur.sel[k] = idx;
      sh.querySelectorAll(`.opt[data-k="${k}"]`).forEach(o=>o.setAttribute("aria-checked", String(o===btn)));
      const sc = $("#sc-"+k); sc.textContent = scoreOf(k, idx); sc.style.color = "var(--accent-text)"; setTimeout(()=>sc.style.color="",400);
      live();
    })); };
    const redrawCrit = ()=>{ $("#crit-box").innerHTML = critHTML(); bindCrit(); };
    sh.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click", ()=>{
      mode = btn.dataset.mode; sh.querySelectorAll("[data-mode]").forEach(o=>o.setAttribute("aria-pressed", String(o===btn)));
      if (mode==="after" && !cur.rsel && !readOnly){ cur.rsel = {...cur.sel}; toast("Start from the current scores and lower what your measures improve"); }
      redrawCrit(); live();
    }));
    const cr = $("#clear-r"); if (cr) cr.addEventListener("click", ()=>{ delete cur.rsel; mode="now"; sh.querySelectorAll("[data-mode]").forEach(o=>o.setAttribute("aria-pressed", String(o.dataset.mode==="now"))); redrawCrit(); live(); });
    sh.querySelectorAll("[data-ph]").forEach(btn=>btn.addEventListener("click", ()=>{ const p=btn.dataset.ph; cur.phases = cur.phases.includes(p) ? cur.phases.filter(x=>x!==p) : PHASES.filter(x=>x===p||cur.phases.includes(x)); btn.setAttribute("aria-pressed", String(cur.phases.includes(p))); }));
    sh.querySelectorAll("[data-cat]").forEach(btn=>btn.addEventListener("click", ()=>{ cur.category = btn.dataset.cat; sh.querySelectorAll("[data-cat]").forEach(o=>o.setAttribute("aria-pressed", String(o===btn))); }));
    bindCrit(); live();
    if (readOnly) return;

    // evidence
    const bindEv = ()=>{
      const inp = $("#ev-in");
      if (inp) inp.addEventListener("change", async ()=>{
        const files = [...inp.files]; if(!files.length) return;
        const add = $(".ev-add"); if (add) add.innerHTML = `<span class="spin"></span><span>Uploading…</span>`;
        for (const f of files){
          try {
            let type = f.type; if (!type){ const ext=(f.name.split(".").pop()||"").toLowerCase(); type = {csv:"text/csv",txt:"text/plain",pdf:"application/pdf"}[ext]; }
            const r = await S.assets.upload(f, type ? {type} : undefined);
            cur.evidence.push({id:r.id, name:f.name.slice(0,80), type:r.contentType});
          } catch(e){ toast(e && e.code==="too_large" ? `${f.name} is over 20 MB` : e && e.code==="unsupported_type" ? `${f.name} isn't a supported file type` : e && e.code==="quota_exceeded" ? "File storage is full" : `Couldn't upload ${f.name}`); }
        }
        $("#ev-box").innerHTML = evHTML(); bindEv();
        if (cur.evidence.length) toast("Attached. Save the impact to keep it.");
      });
      sh.querySelectorAll("[data-evx]").forEach(b=>b.addEventListener("click", ()=>{
        const ix = Number(b.dataset.evx); const e = cur.evidence[ix]; cur.evidence.splice(ix,1);
        $("#ev-box").innerHTML = evHTML(); bindEv();
        if (e && S.assets && !(imp && (imp.evidence||[]).some(x=>x.id===e.id))) S.assets.delete(e.id).catch(()=>{});
      }));
    };
    bindEv();

    // AI
    const go = $("#ai-go");
    if (go) go.addEventListener("click", async ()=>{
      cur.name = $("#i-name").value.trim(); cur.notes = $("#i-notes").value.trim(); cur.mitigation = $("#i-mit").value.trim();
      if (!cur.name){ $("#i-name").focus(); toast("Describe the impact first, for example “dust from earthworks”"); return; }
      go.disabled = true; go.innerHTML = `<span class="spin"></span> Thinking…`;
      const out = $("#ai-out");
      try {
        const r = await S.sample.json(aiPrompt(a, cur), {modelTier:"default"});
        const now = validSel(r && r.current), aft = validSel(r && r.after);
        if (!now) throw {code:"bad_shape"};
        cur.sel = now; if (aft) cur.rsel = aft;
        if (r.mitigation && !cur.mitigation){ cur.mitigation = String(r.mitigation).slice(0,600); $("#i-mit").value = cur.mitigation; }
        out.hidden = false; out.textContent = (r.rationale ? String(r.rationale).slice(0,400) + " " : "") + (r.mitigation && $("#i-mit").value!==String(r.mitigation).slice(0,600) ? "Suggested measures: " + String(r.mitigation).slice(0,400) : "");
        out.textContent = out.textContent.trim() || "Scores applied.";
        redrawCrit(); live(); toast("Suggestion applied. Review and adjust before saving.");
      } catch(e){
        out.hidden = false;
        out.textContent = e && e.code==="not_granted" ? "The AI assistant needs your permission. Allow it when asked, or keep scoring by hand." :
          e && e.code==="rate_limited" ? "Too many requests just now. Wait a minute and try again." :
          "The suggestion didn't come back in a usable form. Try again, or add a short note about the source.";
      } finally { go.disabled = false; go.innerHTML = `${ICON.spark} Suggest again`; }
    });

    $("#i-save").addEventListener("click", async ()=>{
      cur.name = $("#i-name").value.trim(); cur.notes = $("#i-notes").value.trim(); cur.mitigation = $("#i-mit").value.trim();
      if (!cur.name){ $("#i-name").focus(); $("#i-name").style.borderColor="var(--high)"; toast("Name the impact first"); return; }
      if (!cur.phases.length){ $("#phases").scrollIntoView({block:"center", behavior:"smooth"}); toast("Pick at least one project phase"); return; }
      const fresh = findA(a.owner, a.id) || a;
      const next = strip(fresh);
      next.impacts = isNew ? fresh.impacts.concat([cur]) : fresh.impacts.map(x=>x.id===cur.id?cur:x);
      closeSheet();
      const h = H(cur.sel);
      const ok = await upsert(next, (isNew?"Added ":"Updated ") + cur.name + " (H " + h.toLocaleString() + (cur.rsel?" → "+H(cur.rsel).toLocaleString():"") + ")");
      if (ok) toast((isNew?"Added ":"Saved ") + cur.name + " · " + BAND_NAME[band(h)]);
    });
    const del = $("#i-del");
    if (del) del.addEventListener("click", async ()=>{
      if (!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent="Tap again to remove"; setTimeout(()=>{ if(del.isConnected){ del.classList.remove("armed"); del.textContent="Remove"; } },3000); return; }
      const fresh = findA(a.owner, a.id) || a;
      const next = strip(fresh); next.impacts = fresh.impacts.filter(x=>x.id!==cur.id);
      closeSheet(); const ok = await upsert(next, "Removed " + cur.name); if (ok) toast("Removed " + cur.name);
    });
  });
}

async function saveFile(name, data, okMsg){
  if (!S.downloads){
    try { const blob = data instanceof Blob ? data : new Blob([data], {type: /\.csv$/.test(name) ? "text/csv" : "application/json"});
      const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast(okMsg);
    } catch(e){ toast("The file wasn't saved"); }
    return; }
  try { const r = await S.downloads.save({filename:name, data}); if (r && r.status==="saved") toast(okMsg); }
  catch(e){ if (e && e.code==="unavailable") toast("Downloads aren't available in this view"); else if (!(e && /declin|cancel/i.test(e.code||""))) toast("The file wasn't saved"); }
}
const fileBase = a => (a.title||"assessment").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").slice(0,60) || "assessment";
function exportCSV(a){
  const rows = [["Impact","Category","Phase",...CRITERIA.map(c=>c.k+" "+c.name),"H","Band","H after mitigation","Band after","Notes","Mitigation","Evidence files"]];
  a.impacts.forEach(i=>{ const h=H(i.sel), r=i.rsel?H(i.rsel):""; rows.push([i.name,i.category||"",phasesOf(i).join("; "),...CRITERIA.map(c=>scoreOf(c.k,i.sel[c.k])),h,BAND_NAME[band(h)],r,r===""?"":BAND_NAME[band(r)],i.notes||"",i.mitigation||"",(i.evidence||[]).map(e=>e.name).join("; ")]); });
  const csv = rows.map(r=>r.map(v=>{ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(",")).join("\n");
  saveFile(fileBase(a)+".csv", csv, "CSV saved");
}

      impacts:a.impacts.map(i=>({...i, id:uid("i"), sel:{...i.sel}, rsel:i.rsel?{...i.rsel}:undefined, evidence:[]}))};
    copy.impacts.forEach(i=>{ if(!i.rsel) delete i.rsel; });

  }
  else if (act==="del-a" && a){
    if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent="Tap again to delete"; setTimeout(()=>{ if(t.isConnected){ t.classList.remove("armed"); t.textContent="Delete"; } },3000); return; }
    removeA(a.id).then(ok=>{ if(ok){ toast("Assessment deleted"); S.view={name:"history"}; render(); } });
  }
});

async function loadAll(){
  const [a, p] = await Promise.all([
    S.sb.from("assessments").select("id,owner,doc,updated_at").order("updated_at",{ascending:false}).limit(1000),
    S.sb.from("profiles").select("id,display_name").limit(1000)
  ]);
  if (a.error){ toast("Couldn't load assessments: " + a.error.message); S.ready = true; render(); return; }
  const next = {};
  (a.data||[]).forEach(r=>{ const d = r.doc; if (!d || !Array.isArray(d.impacts)) return; (next[r.owner] = next[r.owner] || {owner:r.owner, items:[]}).items.push({...d, id:r.id}); });
  S.docs = next;

function sbSave(items){
  const prev = myItems();
  S.docs[S.meId] = {owner:S.meId, items}; render();
  const before = new Map(prev.map(x=>[x.id, JSON.stringify(x)]));
  const keep = new Set(items.map(x=>x.id));
  const ups = items.filter(x=>before.get(x.id)!==JSON.stringify(x)).map(x=>({id:x.id, owner:S.meId, doc:x, updated_at:new Date(x.updatedAt||Date.now()).toISOString()}));
  const dels = prev.filter(x=>!keep.has(x.id)).map(x=>x.id);
  writeChain = writeChain.then(async ()=>{
    if (ups.length){ const {error} = await S.sb.from("assessments").upsert(ups); if (error) throw error; }
    if (dels.length){ const {error} = await S.sb.from("assessments").delete().in("id", dels); if (error) throw error; }
    return true;
  }).catch(e=>{ toast("Couldn't save: " + ((e && e.message) || "check your connection")); loadAll(); return false; });
  return writeChain;
}

    <form id="auth-form" style="display:grid;gap:14px" novalidate>
      <div class="field"><label for="au-email">Email</label><input id="au-email" type="email" autocomplete="email" required value="${esc(S.authEmail||"")}" placeholder="you@example.com"></div>
      ${mode==="up" ? `<div class="field"><label for="au-name">Your name, as others will see it</label><input id="au-name" autocomplete="name" maxlength="60" value="${esc(S.pendingName||"")}" placeholder="e.g. Mohamed A."></div>` : ""}
      <div class="field"><label for="au-pass">Password</label><input id="au-pass" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}" minlength="8" required placeholder="${mode==="up"?"At least 8 characters":""}"></div>
      <button class="btn primary" type="submit" id="au-go">${mode==="up"?"Create account":"Sign in"}</button>
      ${mode==="in" ? `<p class="lede" style="font-size:13px">Forgot your password? Ask the person who runs this app to reset it.</p>` : ""}
      <p id="au-err" class="lede" style="color:var(--high);font-size:13px" hidden></p>
    </form></div>`;
}
function bindAuth(){
  const f = $("#auth-form"); if (!f) return;
  const err = m => { const e = $("#au-err"); e.textContent = m; e.hidden = !m; };
  document.querySelectorAll("[data-auth]").forEach(b=>b.addEventListener("click", ()=>{ S.authEmail = $("#au-email").value.trim(); S.authMode = b.dataset.auth; render(); }));
  f.addEventListener("submit", async e=>{
    e.preventDefault(); const go = $("#au-go"); go.disabled = true; err("");
    try {
      const email = $("#au-email").value.trim(), password = $("#au-pass").value;
      S.authEmail = email;
      if (!/^\S+@\S+\.\S+$/.test(email)){ err("Enter a valid email address."); return; }
      if ((S.authMode||"in")==="up"){
        S.pendingName = $("#au-name").value.trim();
        if (!S.pendingName){ err("Enter your name so others know who made each assessment."); $("#au-name").focus(); return; }
        if (password.length < 8){ err("Use a password of at least 8 characters."); return; }
        const {data, error} = await S.sb.auth.signUp({email, password});
        if (error){ err(/registered|exists/i.test(error.message) ? "An account with this email already exists. Switch to Sign in." : /not allowed|disabled/i.test(error.message) ? "New accounts are closed. Ask the person who runs this app to add you." : error.message); return; }
        if (!data.session){ err("Account created, but Supabase is still set to confirm emails. In Supabase, turn off Confirm email (Authentication → Sign In / Providers → Email), then sign in."); return; }
        await afterSignIn(data.session.user);
      } else {
        const {data, error} = await S.sb.auth.signInWithPassword({email, password});
        if (error){ err(/confirm/i.test(error.message) ? "This account hasn't been confirmed. Turn off Confirm email in Supabase, or ask the app owner to confirm it." : "Wrong email or password."); return; }
        await afterSignIn(data.user);
      }
    } finally { if (go.isConnected) go.disabled = false; }
  });
}
function accountSheet(){
  const me = S.sbProfiles[S.meId] || {};
  openSheet(`
    <div class="sheet-h"><h3>Your account</h3><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <form class="sheet-b" id="acc-form" novalidate>
      <p class="lede" style="font-size:14px">Signed in as <b>${esc(S.myEmail||"")}</b></p>
      <div class="field"><label for="acc-name">Display name</label><input id="acc-name" maxlength="60" value="${esc(me.name||"")}"></div>
      <div class="field"><label for="acc-pass">New password</label><input id="acc-pass" type="password" autocomplete="new-password" placeholder="Leave blank to keep your current password"></div>
      <p id="acc-err" class="lede" style="color:var(--high);font-size:13px" hidden></p>
    </form>
    <div class="sheet-f"><button class="btn danger" id="acc-out">Sign out</button><div class="spacer"></div><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="acc-save">Save</button></div>`,
  sh=>{
    sh.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeSheet));
    $("#acc-out").addEventListener("click", async ()=>{ await S.sb.auth.signOut(); location.reload(); });
    $("#acc-save").addEventListener("click", async ()=>{
      const name = $("#acc-name").value.trim(), pass = $("#acc-pass").value, e = $("#acc-err");
      if (!name){ e.textContent = "Enter a display name."; e.hidden = false; return; }
      if (pass && pass.length < 8){ e.textContent = "Use a password of at least 8 characters."; e.hidden = false; return; }
      if (pass){ const {error} = await S.sb.auth.updateUser({password:pass}); if (error){ e.textContent = error.message; e.hidden = false; return; } }
      if (name !== me.name){ const {error} = await S.sb.from("profiles").upsert({id:S.meId, display_name:name, updated_at:new Date().toISOString()}); if (error){ e.textContent = error.message; e.hidden = false; return; } }
      closeSheet(); toast(pass ? "Password changed" : "Saved"); loadAll();
    });
  });
}
async function afterSignIn(u){
  if (!u) return;
  S.needAuth = false; S.meId = u.id; S.myEmail = u.email || ""; S.canWrite = true;
  const {data:prof} = await S.sb.from("profiles").select("display_name").eq("id", u.id).maybeSingle();
  if (!prof || !prof.display_name || (S.pendingName && S.pendingName!==prof.display_name)){
    await S.sb.from("profiles").upsert({id:u.id, display_name: S.pendingName || (prof && prof.display_name) || (u.email||"").split("@")[0], updated_at:new Date().toISOString()});
  }
  S.assets = {
    upload: async (file, opts) => {
      const path = u.id + "/" + Date.now().toString(36) + "-" + file.name.replace(/[^\w.\-]+/g,"_").slice(-80);
      const {error} = await S.sb.storage.from("evidence").upload(path, file, {contentType:(opts && opts.type) || file.type || undefined, upsert:false});
      if (error) throw {code: /size|large/i.test(error.message) ? "too_large" : /mime|type/i.test(error.message) ? "unsupported_type" : "upload_failed", message:error.message};
      return {id:path, url:blobUrl(path), contentType:(opts && opts.type) || file.type || "application/octet-stream"};
    },
    delete: async id => { await S.sb.storage.from("evidence").remove([id]); }
  };
  $("#signout").hidden = false;
  S.view = {name:"history"};
  await loadAll();
  if (!S.live){ S.live = S.sb.channel("eia-live").on("postgres_changes", {event:"*", schema:"public", table:"assessments"}, ()=>{ clearTimeout(S.rt); S.rt = setTimeout(loadAll, 400); }).subscribe(); }
}
$("#signout").addEventListener("click", accountSheet);

/* ---------- Boot ---------- */
async function boot(){
  const configured = !/YOUR-PROJECT|YOUR_KEY/.test(SUPABASE_URL + SUPABASE_KEY);
  if (configured && window.supabase && window.supabase.createClient){
    S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    S.sbProfiles = {};
    S.user = {profiles: async ids => Object.fromEntries([].concat(ids).map(id=>[id, S.sbProfiles[id] || {id, name:"", avatarUrl:""}]))};
    const {data:{session}} = await S.sb.auth.getSession();
    if (!session){ S.needAuth = true; S.ready = true; render(); return; }
    await afterSignIn(session.user); return;
  }
  if (configured) toast("Couldn't reach Supabase. Check your connection and reload.");
  S.unconfigured = !configured;
  const use = n => window.claude?.use ? Promise.resolve(claude.use(n)).catch(()=>null) : Promise.resolve(null);
  const [db, user, downloads, sample, assets, comments] = await Promise.all(["db","user","downloads","sample","assets","comments"].map(use));
  Object.assign(S, {db, user, downloads, sample, assets, comments});
  if (user){
    const me = await user.me();
    S.meId = me.id;
    const av = $("#me-avatar"); if (me.id){ av.src = me.avatarUrl; av.alt = me.name || "You"; av.hidden = false; }
  }
  if (!db || !S.meId){ S.offline = true; S.standalone = !window.claude; S.canWrite = true; S.ready = true;
    if (S.standalone){ try { const raw = localStorage.getItem("eia-data"); if (raw){ const d = JSON.parse(raw); if (Array.isArray(d.items)) local.items = d.items; } } catch(e){} }
    render(); return; }
  const cw = user ? await user.can("data.write") : null;
  S.canWrite = cw !== false || (user && await user.isOwner());
  db.collection("assessments").onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(d=>{ const v=d.data(); if (v && Array.isArray(v.items)) next[d.id] = v; });
    S.docs = next; S.ready = true; render();
  }, ()=>{ S.ready = true; render(); toast("Live updates stopped. Reload to reconnect."); });
  setTimeout(()=>{ if(!S.ready){ S.ready = true; render(); } }, 6000);
}
boot();
})();
</script>
